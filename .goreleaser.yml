version: 2

project_name: hosta

before:
  hooks:
    - go mod tidy

builds:
  - id: hosta
    main: ./cmd/hosta
    binary: hosta
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/HobaiRiku/hosta/internal/version.Version={{ .Version }}
      - -X github.com/HobaiRiku/hosta/internal/version.Commit={{ .Commit }}
      - -X github.com/HobaiRiku/hosta/internal/version.BuildDate={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: SHA256SUMS

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  prerelease: auto
