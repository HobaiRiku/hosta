version: 2

project_name: hosta

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: hosta
    main: ./cmd/hosta
    binary: hosta
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/HobaiRiku/hosta/internal/buildinfo.Version={{.Version}}
        -X github.com/HobaiRiku/hosta/internal/buildinfo.Commit={{.Commit}}
        -X github.com/HobaiRiku/hosta/internal/buildinfo.Date={{.CommitDate}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  prerelease: auto
